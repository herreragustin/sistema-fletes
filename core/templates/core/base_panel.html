<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema de fletes{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f6fa;
            color: #111827;
        }

        h1 { margin-bottom: 20px; }

        nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        nav a, .acciones a, button {
            display: inline-block;
            padding: 10px 14px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border: 0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        nav a.secundario, .acciones a.secundario { background: #374151; }
        button.btn-exito { background: #059669; }
        button.btn-peligro { background: #dc2626; }

        .acciones {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .acciones-tabla {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .acciones-tabla a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .acciones-tabla form {
            margin: 0;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .acciones-tabla button {
            padding: 6px 10px;
            font-size: 12px;
        }

        .acciones-tabla input[type="text"] {
            min-width: 160px;
            padding: 6px 8px;
            font-size: 12px;
        }

        form.formulario-principal {
            max-width: 760px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        form.formulario-principal p {
            margin: 0 0 14px;
        }

        form.formulario-principal input,
        form.formulario-principal select,
        form.formulario-principal textarea {
            width: 100%;
            box-sizing: border-box;
        }

        .campo-autocomplete {
            position: relative;
        }

        .sugerencias-direccion {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
            z-index: 20;
            max-height: 220px;
            overflow-y: auto;
            display: none;
        }

        .sugerencias-direccion.visible {
            display: block;
        }

        .sugerencia-item {
            width: 100%;
            border: 0;
            background: white;
            color: #111827;
            text-align: left;
            padding: 10px 12px;
            font-size: 14px;
            cursor: pointer;
        }

        .sugerencia-item:hover,
        .sugerencia-item.activa {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .errorlist {
            color: #991b1b;
            margin: 0 0 8px;
            padding-left: 18px;
        }

        .resumen-total {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .resumen-total div {
            background: white;
            border-radius: 8px;
            padding: 14px 18px;
            min-width: 180px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .resumen-total span,
        .resumen-total strong {
            display: block;
        }

        .resumen-total strong {
            margin-top: 6px;
            font-size: 22px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .dashboard-bloque {
            background: white;
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .dashboard-bloque h2 {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 18px;
        }

        .lista-resumen {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .lista-resumen-item {
            padding-bottom: 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        .lista-resumen-item:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .dashboard-nota {
            margin-top: 20px;
            color: #4b5563;
            font-size: 13px;
        }

        form.filtros {
            margin-bottom: 20px;
            background: white;
            padding: 16px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            align-items: end;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .filtros-campo {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 150px;
        }

        .filtros-campo-texto {
            min-width: 220px;
            flex: 1 1 240px;
        }

        .filtros-acciones {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-left: auto;
            flex-wrap: wrap;
        }

        .btn-secundario {
            display: inline-block;
            padding: 10px 14px;
            background: #e5e7eb;
            color: #111827;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #374151;
            margin-bottom: 4px;
        }

        input, select {
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            min-width: 150px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 14px;
            vertical-align: top;
        }

        th {
            background: #111827;
            color: white;
        }

        tr:hover { background-color: #f9fafb; }

        .estado {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            background: #e5e7eb;
            color: #374151;
        }

        .pendiente, .sin_estado { background: #fef3c7; color: #92400e; }
        .en_curso { background: #fde68a; color: #92400e; }
        .finalizado, .pagada, .activo, .cobrado, .liquidado { background: #d1fae5; color: #065f46; }
        .no_exigible, .no_liquidable { background: #e5e7eb; color: #374151; }
        .retenido { background: #ede9fe; color: #5b21b6; }
        .excepcion { background: #ffedd5; color: #9a3412; }
        .cancelado, .anulada, .inactivo { background: #fee2e2; color: #991b1b; }

        .sin-datos {
            padding: 20px;
            background: white;
            border-radius: 8px;
        }

        .mensajes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mensaje {
            padding: 12px 14px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .mensaje.success { background: #d1fae5; color: #065f46; }
        .mensaje.info { background: #dbeafe; color: #1d4ed8; }
        .mensaje.warning { background: #fef3c7; color: #92400e; }
        .mensaje.error { background: #fee2e2; color: #991b1b; }

        .indicador-cierre {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 8px;
            border-radius: 999px;
            background: #fef3c7;
            color: #92400e;
            font-size: 12px;
            font-weight: bold;
        }

        .muted { color: #6b7280; }

        @media (max-width: 900px) {
            .filtros-acciones {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'panel_inicio' %}" class="secundario">Panel</a>
        <a href="{% url 'lista_fletes' %}" class="secundario">Fletes</a>
        <a href="{% url 'lista_clientes' %}" class="secundario">Clientes</a>
        <a href="{% url 'cuenta_corriente_clientes' %}" class="secundario">Cuenta corriente</a>
        <a href="{% url 'lista_choferes' %}" class="secundario">Choferes</a>
        <a href="{% url 'liquidacion_choferes' %}" class="secundario">Liquidacion choferes</a>
        <a href="{% url 'facturacion' %}" class="secundario">Facturacion</a>
        <a href="{% url 'reportes' %}" class="secundario">Reportes</a>
        <a href="{% url 'lista_viajes' %}" class="secundario">Viajes historicos</a>
        <a href="{% url 'lista_facturas' %}" class="secundario">Facturas historicas</a>
        <a href="/admin/" class="secundario">Admin</a>
    </nav>

    {% if messages %}
        <div class="mensajes">
            {% for message in messages %}
                <div class="mensaje {{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
